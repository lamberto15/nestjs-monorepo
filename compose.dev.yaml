# The development services: pnpm services:up / services:down.
name: nestjs-monorepo-dev

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      # PostgreSQL 18's image keeps its data under /var/lib/postgresql/18: mount the parent.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 2s
      timeout: 5s
      retries: 15

  redis:
    image: redis:8.10.3-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
