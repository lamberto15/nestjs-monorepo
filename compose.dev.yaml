# The development services: pnpm services:up / services:down.
name: nestjs-monorepo-dev

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      # PostgreSQL 18's image keeps its data under /var/lib/postgresql/18: mount the parent.
      - postgres_data:/var/lib/postgresql
      # Marks a new database as a development one (the demo seed needs it);
      # an existing database: pnpm db:mark-dev.
      - ./tools/dev/10-dev-database.sql:/docker-entrypoint-initdb.d/10-dev-database.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 2s
      timeout: 5s
      retries: 15

  redis:
    image: redis:8.10.3-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 15

  # Gotenberg: renders a record's PDF (modules/documents; GOTENBERG_URL=http://127.0.0.1:3100).
  # Only with the profile: docker compose -f compose.dev.yaml --profile documents up -d --wait
  # Its Chromium may load the page it is given and nothing else, and runs no script.
  gotenberg:
    image: gotenberg/gotenberg:9.7.0-chromium
    profiles: [documents]
    restart: unless-stopped
    command:
      - gotenberg
      - --chromium-allow-list=^file:///tmp/
      - --chromium-deny-private-ips
      - --chromium-deny-public-ips
      - --chromium-disable-javascript
      - --api-disable-download-from
      - --webhook-disable
      - --api-timeout=60s
    ports:
      - '127.0.0.1:3100:3000'

  # Garage: an S3-compatible store, to try STORAGE_DRIVER=s3 (presigned
  # uploads and downloads) on this machine and in CI. Only with the profile:
  # pnpm storage:up (starts it, then tools/dev/garage-setup.sh makes the
  # layout, the key and the bucket). Development values only.
  garage:
    image: dxflrs/garage:v2.5.0
    profiles: [storage]
    restart: unless-stopped
    configs:
      - source: garage
        target: /etc/garage.toml
    ports:
      - '127.0.0.1:3900:3900'
    volumes:
      - garage_data:/var/lib/garage
    healthcheck:
      test: ['CMD', '/garage', 'status']
      interval: 2s
      timeout: 5s
      retries: 15

configs:
  # Inline, not a mounted file: some Docker setups mount files empty.
  garage:
    content: |
      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      db_engine = "sqlite"
      replication_factor = 1
      rpc_bind_addr = "[::]:3901"
      rpc_public_addr = "127.0.0.1:3901"
      rpc_secret = "6295cc36bf51fedf5903b9f092646eba12758def845af5d81b6cfa4ea587d613"

      [s3_api]
      s3_region = "garage"
      api_bind_addr = "[::]:3900"
      root_domain = ".s3.garage.localhost"

volumes:
  postgres_data:
  garage_data:
