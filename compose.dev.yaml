# The development services: pnpm services:up / services:down.
# A second project made from the template runs its own beside this one: its
# .env at the repository's root (docker compose reads it) names another
# COMPOSE_PROJECT_NAME and other host ports (POSTGRES_PORT, REDIS_PORT, …),
# and its apps/api/.env points at them: `pnpm run setup --dev-ports 1`
# writes both (docs/development.md, "Two projects on one machine").
name: nestjs-monorepo-dev

services:
  postgres:
    image: postgres:18.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # PostgreSQL 18's image keeps its data under /var/lib/postgresql/18: mount the parent.
      - postgres_data:/var/lib/postgresql
      # Marks a new database as a development one (the demo seed needs it);
      # an existing database: pnpm db:mark-dev.
      - ./tools/dev/10-dev-database.sql:/docker-entrypoint-initdb.d/10-dev-database.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 2s
      timeout: 5s
      retries: 15

  redis:
    image: redis:8.10.3-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 15

  # Gotenberg: renders a record's PDF (modules/documents; GOTENBERG_URL=http://127.0.0.1:3100).
  # Only with the profile: docker compose -f compose.dev.yaml --profile documents up -d --wait
  # Its Chromium may load the page it is given and nothing else, and runs no script.
  gotenberg:
    image: gotenberg/gotenberg:9.9.3-chromium
    profiles: [documents]
    restart: unless-stopped
    command:
      - gotenberg
      - --chromium-allow-list=^file:///tmp/
      - --chromium-deny-private-ips
      - --chromium-deny-public-ips
      - --chromium-disable-javascript
      - --api-disable-download-from
      - --webhook-disable
      - --api-timeout=60s
    ports:
      - '127.0.0.1:${GOTENBERG_PORT:-3100}:3000'

  # Garage: an S3-compatible store, to try STORAGE_DRIVER=s3 (presigned
  # uploads and downloads) on this machine and in CI. Only with the profile:
  # pnpm storage:up (starts it, then tools/dev/garage-setup.sh makes the
  # layout, the key and the bucket). Development values only.
  garage:
    image: dxflrs/garage:v2.5.0
    profiles: [storage]
    restart: unless-stopped
    configs:
      - source: garage
        target: /etc/garage.toml
    ports:
      - '127.0.0.1:${GARAGE_PORT:-3900}:3900'
    volumes:
      - garage_data:/var/lib/garage
    healthcheck:
      test: ['CMD', '/garage', 'status']
      interval: 2s
      timeout: 5s
      retries: 15

  # Nestrix: the self-hosted tracing server (core/observability), to see where
  # a request spends its time while you use the app. Only with the profile:
  # pnpm traces:up (makes its database in the postgres above, then starts
  # it), and OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 in
  # apps/api/.env. Dashboard: http://localhost:4318, the password below.
  # Development values only: no ingest key (it listens on loopback alone).
  nestrix:
    image: ghcr.io/nestrix-js/nestrix-server:0.11.0@sha256:00b035c65e1c3648504b0057e2d1741e226b3a496e047ff26ea55687fd53ec01
    profiles: [traces]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/nestrix
      NESTRIX_INGEST_AUTH: none
      NESTRIX_ADMIN_PASSWORD: ${NESTRIX_ADMIN_PASSWORD:-nestrix-dev-password}
      # Sessions survive a restart of the server.
      NESTRIX_SESSION_SECRET: nestrix-dev-session-secret-0123456789abcdef
      # The app's own metrics (core/metrics) beside Nestrix's runtime ones.
      NESTRIX_METRICS: 'all'
      NESTRIX_LOG_FORMAT: text
    ports:
      - '127.0.0.1:${NESTRIX_PORT:-4318}:4318'

configs:
  # Inline, not a mounted file: some Docker setups mount files empty.
  garage:
    content: |
      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      db_engine = "sqlite"
      replication_factor = 1
      rpc_bind_addr = "[::]:3901"
      rpc_public_addr = "127.0.0.1:3901"
      rpc_secret = "6295cc36bf51fedf5903b9f092646eba12758def845af5d81b6cfa4ea587d613"

      [s3_api]
      s3_region = "garage"
      api_bind_addr = "[::]:3900"
      root_domain = ".s3.garage.localhost"

volumes:
  postgres_data:
  garage_data:
