<p>{{ greeting }}</p>
<p>{{ intro }}</p>
{{#each items}}
<div style="margin: 16px 0; padding: 12px 16px; border-left: 3px solid #d0d7de">
  <strong>{{ title }}</strong><br />
  {{ body }}<br />
  <span style="color: #59636e; font-size: 13px">{{ at }}</span>{{#if url}} ·
  <a href="{{ url }}">{{ open }}</a>{{/if}}
</div>
{{/each}} {{#if more}}
<p>{{ more }}</p>
{{/if}}
<p style="color: #59636e; font-size: 13px">
  {{ footer }}{{#if unsubscribeUrl}}
  <a href="{{ unsubscribeUrl }}">{{ unsubscribe }}</a>{{/if}}
</p>
