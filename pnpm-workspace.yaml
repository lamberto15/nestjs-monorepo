packages:
  - apps/*
  - packages/*
# Dependencies are pinned to exact versions (no ^ or ~).
saveExact: true
allowBuilds:
  # The web app's bundler: its install step checks the platform binary.
  esbuild: true
  # The API's dev builds (nest start -b swc): its install step checks the platform binary.
  '@swc/core': true
  # Swagger UI's install-count ping: not wanted.
  '@scarf/scarf': false
  # bullmq's msgpackr: an optional native speedup with a prebuilt binary.
  msgpackr-extract: true
  # Installs the git hooks of lefthook.yml.
  lefthook: true
  protobufjs: false
  re2: true

# Advisories `pnpm audit` skips, each with no fixed version and a reason it
# does not reach the app. Remove an entry once a fix is out (CI audits nightly).
auditConfig:
  ignoreGhsas:
    # picomatch ReDoS (2026-10-19, no patched version): only through
    # re2 > node-gyp, the native build at install time, never at runtime.
    - GHSA-fc5q-39xc-vjpf
minimumReleaseAgeExclude:
  - '@nestrix-js/nestjs@0.7.0 || 0.8.0 || 0.9.1'
