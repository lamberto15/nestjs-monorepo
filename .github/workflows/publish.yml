# Publishes the image to GitHub's registry (ghcr.io/<owner>/<repo>): from
# main once CI has passed on that commit (`sha-<commit>`, and `main` while the
# commit is still main's head), and from a `v*` tag (`1.2.3` and `1.2`), which
# re-tags the `sha-<commit>` image CI passed, never a new build. Never
# `latest`: a deployment names the version it runs. Deploying it is the
# deployment's own (PORTING.md). docs/ci.md, "Publishing the image".
#
# Third-party actions are pinned by commit SHA (the comment names the
# release); Dependabot proposes newer ones.
name: Publish

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']

permissions:
  contents: read

# One commit's (or one tag's) runs one after the other. Moving `main` has a
# group of its own, shared by every commit (job `main`).
concurrency:
  group: publish-${{ github.event.workflow_run.head_sha || github.ref }}

jobs:
  # Main: the commit CI passed, built and pushed as `sha-<commit>`.
  image:
    # Only a push's CI run that passed (not the nightly one).
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.commit.outputs.image }}
      sha: ${{ steps.commit.outputs.sha }}
      digest: ${{ steps.build.outputs.digest }}
      head: ${{ steps.head.outputs.head }}
    steps:
      - id: commit
        name: The commit and its image
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.commit.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cleanup: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # No build-record artifact: nothing reads it, and it counts toward
          # the account's artifact storage.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          push: true
          tags: ${{ steps.commit.outputs.image }}:sha-${{ steps.commit.outputs.sha }}
          build-args: GIT_SHA=${{ steps.commit.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}
          # CI's image job fills the cache on main: this build reuses it.
          cache-from: type=gha
          provenance: mode=max
          sbom: true
      # Checked here, outside the `main` group, so a run for a commit that is
      # no longer the head never joins (and never pushes out, as a newer
      # pending run, the head's own run). Checked again inside it.
      - id: head
        name: Still main's head?
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          head=$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$head" = "$SHA" ]; then
            echo "head=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main is at $head now: sha-$SHA is published, main is left to that commit's run"
            echo "head=false" >> "$GITHUB_OUTPUT"
          fi

  # Main: `main` points at the image just pushed, by digest, while its commit
  # is main's head. One run at a time for every commit, so an older run never
  # moves `main` back.
  main:
    needs: image
    if: needs.image.outputs.head == 'true'
    concurrency:
      group: publish-main
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cleanup: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag main, if the commit is still main's head
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          IMAGE: ${{ needs.image.outputs.image }}
          SHA: ${{ needs.image.outputs.sha }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          head=$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$head" != "$SHA" ]; then
            echo "::notice::main is at $head now: main is left to that commit's run"
            exit 0
          fi
          docker buildx imagetools create --tag "$IMAGE:main" "$IMAGE@$DIGEST"
          echo "$IMAGE:main is sha-$SHA ($DIGEST)"

  # A version tag: the image CI passed for the tagged commit (`sha-<commit>`,
  # published from main) gets the version's tags, by digest. A commit with
  # no such image (not on main, or its CI failed) is refused.
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cleanup: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the version on the commit's image
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REF_NAME#v}"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::$REF_NAME is not a version tag (v1.2.3)"
            exit 1
          fi
          # The commit the tag names (an annotated tag is an object of its own).
          sha=$(gh api "repos/$REPOSITORY/commits/$GITHUB_REF" --jq .sha)
          image="ghcr.io/${REPOSITORY,,}"
          digest=$(docker buildx imagetools inspect "$image:sha-$sha" --format '{{.Manifest.Digest}}' || true)
          case "$digest" in
            sha256:*) ;;
            *)
              echo "::error::$image:sha-$sha does not exist: tag a commit of main whose CI passed and whose image was published"
              exit 1
              ;;
          esac
          docker buildx imagetools create \
            --tag "$image:$version" --tag "$image:${version%.*}" "$image@$digest"
          echo "$image:$version and $image:${version%.*} are sha-$sha ($digest)"
